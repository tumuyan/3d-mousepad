# `**` 即「所有分支」（glob 匹配任意分支名）。
# 注意：`$` 是兜底键，仅当没有任何 glob 命中时才生效；既然 `**` 已匹配全部分支，
# 再写 `$` 永远轮不到，反而会让其中的 vscode 配置失效。所以 push / vscode 都统一放 `**` 下。
"**":
  push:
    - name: run test
      docker:
        image: node:22
      stages:
        - name: setup
          script:
            - npm ci
            # 容器里以 root 跑，Playwright 自己会带 --no-sandbox。
            - npx playwright install --with-deps chromium
        - name: run test
          script: npm test
  vscode:
    - services:
        - vscode
      env:
        CNB_WELCOME_CMD: node server.js
      stages:
        - name: 环境已就绪
          script: echo "终端里 server.js 已监听 5213"
