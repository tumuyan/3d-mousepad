<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  #app { display:flex; height:100vh; background:#17181c; }

  /* ---------- 侧栏 ---------- */
  #panel {
    width:330px; min-width:330px; height:100%; overflow-y:auto;
    background:#1e2026; color:#d7d9e0; padding:14px 14px 40px;
    border-right:1px solid #2c2f38;
  }
  #panel::-webkit-scrollbar { width:8px; }
  #panel::-webkit-scrollbar-thumb { background:#3a3d47; border-radius:4px; }
  h1 { font-size:17px; font-weight:600; color:#fff; padding:4px 2px 12px; letter-spacing:.5px; }
  h1 span { color:#ff7eb6; }
  details { background:#262931; border:1px solid #333743; border-radius:10px; margin-bottom:10px; overflow:hidden; }
  summary {
    cursor:pointer; padding:10px 12px; font-size:13px; font-weight:600; color:#e8eaf0;
    list-style:none; user-select:none; display:flex; align-items:center;
  }
  summary::before { content:"▸"; margin-right:8px; font-size:11px; color:#8b8fa0; transition:transform .15s; }
  details[open] summary::before { transform:rotate(90deg); }
  .sec-body { padding:4px 12px 12px; }

  .row { display:flex; align-items:center; margin:8px 0; gap:8px; min-width:0; }
  .row label { flex:0 0 64px; font-size:12px; color:#a6aab8; }
  .row input[type=range] { flex:1 1 auto; min-width:0; accent-color:#ff7eb6; height:20px; }
  .row .val { flex:0 0 58px; width:58px; font-size:11px; color:#c9cdda; text-align:right; font-variant-numeric:tabular-nums; }
  .row input[type=color] { width:42px; height:24px; border:none; border-radius:5px; background:none; cursor:pointer; padding:0; }
  .row select {
    flex:1; background:#1a1c22; color:#d7d9e0; border:1px solid #3a3d47; border-radius:6px;
    padding:5px 8px; font-size:12px; outline:none;
  }
  .row input[type=checkbox] { accent-color:#ff7eb6; width:15px; height:15px; }

  /* ---------- 上传区 ---------- */
  .dropzone {
    border:1.5px dashed #4a4e5c; border-radius:10px; padding:12px; text-align:center;
    font-size:12px; color:#8b8fa0; cursor:pointer; transition:.15s; margin-bottom:8px;
    background:#21242c; position:relative;
  }
  .dropzone:hover { border-color:#ff7eb6; color:#ffb9d6; }
  .dropzone img { max-width:100%; max-height:90px; border-radius:6px; display:block; margin:0 auto; }
  .dropzone .clear {
    position:absolute; top:5px; right:7px; width:18px; height:18px; border-radius:50%;
    background:#000a; color:#fff; font-size:11px; line-height:18px; cursor:pointer;
  }
  .dropzone .clear:hover { background:#ff4d6d; }
  .dz-wrap { position:relative; padding-left:34px; margin-bottom:8px; }
  .dz-wrap .dropzone { margin-bottom:0; }
  .hint { font-size:11px; color:#6f7382; margin:2px 0 8px; line-height:1.5; }

  /* ---------- Toast ---------- */
  #toast-wrap { position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    display:flex; flex-direction:column; gap:8px; z-index:9999; pointer-events:none; }
  .toast { pointer-events:auto; max-width:320px; padding:11px 16px; border-radius:10px;
    font-size:13px; line-height:1.5; color:#e6e8ee; background:#2a2e38;
    border:1px solid #4a4e5c; box-shadow:0 6px 22px #0008;
    opacity:0; transform:translateY(10px); transition:opacity .25s, transform .25s; }
  .toast.show { opacity:1; transform:translateY(0); }
  .toast.err { color:#ff6b78; }

  /* ---------- 按钮 ---------- */
  .btn {
    display:block; width:100%; padding:9px 0; margin:8px 0 0; border:none; border-radius:8px;
    background:linear-gradient(135deg,#ff7eb6,#ff5e8a); color:#fff; font-size:13px; font-weight:600;
    cursor:pointer; letter-spacing:1px; transition:filter .15s;
  }
  .btn:hover { filter:brightness(1.12); }
  .btn.ghost { background:#31343e; color:#cfd2dc; font-weight:500; }
  .btn.ghost:hover { background:#3b3f4b; }
  .btn-row { display:flex; gap:6px; }
  .btn-row .btn { margin-top:8px; }
  button.paste-btn {
    position:absolute; left:0; top:0; bottom:0;
    width:26px; padding:0; margin:0;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid #4a4e5c; background:#2a2e38; color:#cdd3dd; border-radius:6px;
    cursor:pointer; font-size:14px; line-height:1; transition:.15s;
  }
  button.paste-btn:hover { border-color:#ff7eb6; color:#ffb9d6; }
  button.paste-btn:disabled { opacity:.5; cursor:default; }

  /* ---------- 视口 ---------- */
  #stage { flex:1; position:relative; }
  #view { width:100%; height:100%; display:block; }
  #stage.checker {
    background:#202228;
    background-image:
      linear-gradient(45deg,#2a2c33 25%,transparent 25%,transparent 75%,#2a2c33 75%),
      linear-gradient(45deg,#2a2c33 25%,transparent 25%,transparent 75%,#2a2c33 75%);
    background-size:24px 24px; background-position:0 0,12px 12px;
  }
  #toolbar {
    position:absolute; top:14px; right:16px; display:flex; gap:8px; align-items:center;
  }
  /* 主工具栏（导出图片 / 复制 / 配置）：与 #toolbar 同一行，置于其左方 */
  #topbar {
    position:absolute; top:14px; left:16px; right:auto; display:flex; gap:8px; align-items:center; z-index:6;
  }
  .dd-btn {
    background:#262931cc; backdrop-filter:blur(6px); border:1px solid #3a3d47; color:#cfd2dc;
    padding:7px 14px; font-size:12px; cursor:pointer; border-radius:8px; transition:.15s;
  }
  .dd-btn:hover { color:#fff; background:#31343e; }
  .dropdown { position:relative; }
  .dd-menu {
    display:none; position:absolute; right:0; top:calc(100% + 6px); min-width:160px;
    background:#262931f2; backdrop-filter:blur(8px); border:1px solid #3a3d47; border-radius:8px;
    padding:5px; box-shadow:0 6px 20px #000a; z-index:7;
  }
  .dropdown.open .dd-menu { display:block; }
  .dd-menu button {
    display:block; width:100%; text-align:left; background:transparent; border:none;
    color:#d7d9e0; padding:8px 10px; font-size:12px; cursor:pointer; border-radius:6px;
  }
  .dd-menu button:hover { background:#31343e; color:#fff; }
  /* 分段按钮组：外观连在一起 */
  .seg {
    display:inline-flex; border-radius:8px; overflow:hidden;
    background:#262931cc; backdrop-filter:blur(6px); border:1px solid #3a3d47;
  }
  .seg button {
    background:transparent; border:none; border-right:1px solid #3a3d47; color:#cfd2dc;
    padding:7px 14px; font-size:12px; cursor:pointer; transition:.15s; border-radius:0;
  }
  .seg button:last-child { border-right:none; }
  .seg button:hover { color:#fff; background:#31343e; }
  .seg button.active { background:linear-gradient(135deg,#ff7eb6,#ff5e8a); color:#fff; }
  #toolbar select {
    background:#262931cc; backdrop-filter:blur(6px); border:1px solid #ff7eb6; color:#ffb9d6;
    padding:7px 10px; border-radius:8px; font-size:12px; cursor:pointer; outline:none;
  }
  #modeHint {
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    background:#262931cc; backdrop-filter:blur(6px); border:1px solid #3a3d47; color:#cfd2dc;
    padding:6px 14px; border-radius:8px; font-size:12px; pointer-events:none; display:none;
    white-space:nowrap;
  }

/* 轮廓控制点叠加层：仅在编辑轮廓时显示并接收指针事件 */
#curveLayer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: none;
  z-index: 4;
  cursor: crosshair;
}
#curveLayer.on {
  display: block;
}


  #dropHint {
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:#0009; color:#ffb9d6; font-size:20px; font-weight:600; pointer-events:none; z-index:5;
  }

  /* ---------- 关于页脚 ---------- */
  #about {
    margin-top:14px; padding:12px 10px 4px; border-top:1px solid #2c2f38;
    font-size:11px; color:#8b8fa0; line-height:1.8;
  }
  #about .about-title { color:#cfd2dc; font-weight:600; margin-bottom:4px; }
  #about a { color:#7fb0ff; text-decoration:none; word-break:break-all; }
  #about a:hover { text-decoration:underline; }

</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="app">
  <aside id="panel">
    <h1>3D MousePad <span>Studio</span></h1>

    <details open>
      <summary>贴图</summary>
      <div class="sec-body">
        <div class="dz-wrap">
          <button class="paste-btn" id="paste1" type="button" title="粘贴剪贴板图片">📋</button>
          <div class="dropzone" id="dz1">点击上传主贴图<br><small>或拖拽图片到画布</small></div>
        </div>
        <input type="file" id="file1" accept="image/*" hidden>
        <div class="dz-wrap">
          <button class="paste-btn" id="paste2" type="button" title="粘贴剪贴板图片">📋</button>
          <div class="dropzone" id="dz2">点击上传腕托贴图（可选）<br><small>上传后将覆盖腕托区域</small></div>
        </div>
        <input type="file" id="file2" accept="image/*" hidden>
        <div class="hint">提示：直接把图片文件拖到右侧画布也可上传（自动填入空位）。点击左侧「粘贴」按钮，可将剪贴板中的图片填入对应槽位（不经过预览区）。</div>
        <div id="tex1Ctrls"></div>
        <div id="tex2Ctrls"></div>
      </div>
    </details>

    <details open>
      <summary>鼠标垫外形</summary>
      <div class="sec-body" id="shapeCtrls"></div>
    </details>

    <details open>
      <summary>腕托</summary>
      <div class="sec-body" id="wristCtrls"></div>
    </details>

    <details>
      <summary>光照</summary>
      <div class="sec-body" id="lightCtrls"></div>
    </details>

    <details open>
      <summary>背景与导出</summary>
      <div class="sec-body" id="exportCtrls"></div>
    </details>

    <footer id="about">
      <div class="about-title">3D MousePad Studio</div>
      <div class="about-line">作者：<a href="https://github.com/tumuyan" target="_blank" rel="noopener">tumuyan</a></div>
      <div class="about-line">协议：<a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener">GNU AGPL v3</a></div>
      <div class="about-line">仓库：<a href="https://github.com/tumuyan/3d-mousepad" target="_blank" rel="noopener">github.com/tumuyan/3d-mousepad</a></div>
    </footer>
  </aside>

  <main id="stage">
    <canvas id="view"></canvas>
    <canvas id="curveLayer"></canvas>
    <div id="topbar">
      <div class="dropdown" id="ddExportImg">
        <button class="dd-btn">导出图片 ▾</button>
        <div class="dd-menu">
          <button data-act="preview">预览图 (PNG)</button>
          <button data-act="model">渲染图 (PNG)</button>
        </div>
      </div>
      <div class="dropdown" id="ddConfig">
        <button class="dd-btn">配置 ▾</button>
        <div class="dd-menu">
          <button data-act="exportJson">导出配置 (JSON)</button>
          <button data-act="exportZip">导出配置 (ZIP)</button>
          <button data-act="import">导入配置…</button>
        </div>
      </div>
      <input type="file" id="cfgFile" accept=".json,.zip,application/json,application/zip" hidden>
    </div>
    <div id="toolbar">
      <div class="seg" id="modeSeg" title="鼠标交互模式">
        <button data-mode="view" class="active">视角</button>
        <button data-mode="t1">主贴图</button>
        <button data-mode="t2">腕托贴图</button>
      </div>
      <div class="seg" id="viewSeg">
        <button data-view="persp">透视</button>
        <button data-view="top">顶视</button>
        <button data-view="front">前视</button>
      </div>
    </div>
    <div id="modeHint"></div>
    <div id="dropHint">松开以上传图片</div>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= 工具函数 ================= */
const norm2 = (x, y) => { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l }; };

/* ================= 参数 ================= */
// 默认经典轮廓锚点（按 3d MousePad Template），用于首次加载与“重置锚点”。
// 运行时坐标采用顶层 {x,y,h1,h2}（与 bakeClassicCtrl / makeClassicShape 约定一致）。
// 共 7 个锚点：首尾为 pin（接缝，手柄由 ensureClassicCtrl 重算），中间 5 个可拖拽。
const DEFAULT_CLASSIC_CTRL = [
  { x: -77.87016515677138, y: -116.87196203842663, h1: { x: -77.87016515677138, y: -116.87196203842663 }, h2: { x: -81.75976991430169, y: -101.1194309458591 } },
  { x: -72.39671119796571, y: -66.03870827899848, h1: { x: -73.41438595928038, y: -78.25380858100641 }, h2: { x: -70.87398786041214, y: -47.76153465979944 } },
  { x: -103.02017794430475, y: -3.591958181479075, h1: { x: -91.22373904493193, y: -27.961251618686443 }, h2: { x: -112.8317730574489, y: 16.67700963490084 } },
  { x: -93.14914645679774, y: 50.287355985997074, h1: { x: -98.81515685043313, y: 43.43436161334235 }, h2: { x: -63.7719811054472, y: 85.8188031332696 } },
  { x: 0.5478745968429263, y: 96.93694595772325, h1: { x: -34.775768031004915, y: 96.15593587902342 }, h2: { x: 29.71789177917693, y: 97.58189862172993 } },
  { x: 91.81815115714443, y: 46.6804878923647, h1: { x: 70.12431390266855, y: 79.49146313593883 }, h2: { x: 110.86396431535806, y: 17.874532694237914 } },
  { x: 99.68920152549207, y: -32.5305450234862, h1: { x: 99.68920152549207, y: -32.5305450234862 }, h2: { x: 93.8222688203322, y: -56.27944749493295 } },
  { x: 82.84846493178915, y: -85.45820524939745, h1: { x: 87.09875240404779, y: -61.367411896576435 }, h2: { x: 81.13539464219684, y: -95.16795373459694 } },
  { x: 77.87016515677138, y: -116.87196203842663, h1: { x: 81.1672277264742, y: -105.1974693635984 }, h2: { x: 77.87016515677138, y: -116.87196203842663 } },
];
const P = {
  // 外形
  shape: 'classic',   // rect | ellipse | stadium | classic
  cfgName: '',        // 配置名称，用于导出文件名（留空则用默认名）
  padW: 230, padH: 265, corner: 48, thick: 1, bevel: 3,
  edgeColor: '#f4f1ec',
  edgeSame: true,   // true=边缘与上表面作为整体着色（共享本色+贴图）
  // 腕托
  wristStyle: 'balls', // none | full | balls
  wH: 27,             // 隆起高度
  wW: 150,            // 宽度（整体式）
  wD: 89,             // 前后长度
  wPos: 20,           // 距底边距离
  wGap: 71,           // 双球间距
  wBW: 82,            // 单球宽度
  wMorph: 0.55,       // 整体腕托: 0=椭球 1=肾型
  wMorphRot: 0,       // 整体腕托旋转角度（度），肾型形状不变，仅绕竖直轴旋转
  wRot: 10,            // 双球旋转角（两球反向）
  wEgg: 0.1,            // 双球鹅蛋度 -0.45..0.45
  wJoin: 16,           // 双球过渡弧宽度（0=保留原始相交尖角）
  wMargin: 2,         // 经典款：外形超出腕托的距离（overhang）
  wristTopGap: 215,   // 经典款：腕托顶 → 轮廓顶的距离（决定垫身总长）
  // 经典款上半轮廓：一串三次贝塞尔锚点（含切线手柄），由腕托足迹自动烘焙后可手动拖拽。
  // null 表示尚未烘焙，首次生成时按 wristTopGap 自动生成。
  // 结构：[{ x, y, h1:{x,y}, h2:{x,y}, pin?:true }]，pin 点为足迹接缝，位置由腕托决定
  classicCtrl: structuredClone(DEFAULT_CLASSIC_CTRL),
  // 材质
  rough: 0.55,
  matColor: '#b6e3a8',   // 材质底色（贴图叠加在其上方）
  matOpacity: 1,         // 本色不透明度（整体）
  texOpacity: 1,         // 贴图不透明度（仅影响贴图叠加强度）
  // 贴图变换
  t1: { s: 1, ox: 0, oy: 0, r: 0, wrap: 'cutout', asp: 1 },
  t2: { s: 1, ox: 0, oy: 0, r: 0, wrap: 'cutout', asp: 1 },
  // 光照
  hemi: 0.55, key: 1.8, az: 35, el: 55, lightColor: '#ffffff', env: 0.6,
  shadow: false,
  // 背景/导出
  bg: '#e9e7ec', transparent: false, exportTransparent: false, exportScale: 2,
};

/* ================= 渲染基础 ================= */
const canvas = document.getElementById('view');
const stage  = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, premultipliedAlpha: false, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 1, 6000);
// 编辑态专用正交相机：正俯视，Shape-X 映屏幕 X，Shape-Y 映世界 -Z 映屏幕 Y。
// 使用独立相机意味着渲染与覆盖层投影严格同源、aspect 由 setEditOrtho 同步计算，
// 无需依赖 PerspectiveCamera 的退化 lookAt 或 up 向量。
let orthoCam = null;       // 延迟创建（需要等 stage 拿到尺寸后才能正确设置 left/right/top/bottom）
// 透视视角：相机在水平面上绕 Z 轴逆时针 45°，再抬高
const PERSP_POS = (() => {
  const d = 470, a = -Math.PI / 4; // 顺时针 45°，默认透视距离
  return new THREE.Vector3(d * Math.sin(a), 235, d * Math.cos(a));
})();
const HOME = { pos: PERSP_POS.clone(), tgt: new THREE.Vector3(0, 0, 0) };
camera.position.copy(HOME.pos);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.copy(HOME.tgt);
controls.maxDistance = 1600;
controls.minDistance = 60;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const hemiLight = new THREE.HemisphereLight(0xffffff, 0x777788, P.hemi);
scene.add(hemiLight);

const keyLight = new THREE.DirectionalLight(P.lightColor, P.key);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = keyLight.shadow.camera.bottom = -320;
keyLight.shadow.camera.right = keyLight.shadow.camera.top = 320;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xdde4ff, 0.35);
fillLight.position.set(-300, 200, -250);
scene.add(fillLight);

const shadowPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000),
  new THREE.ShadowMaterial({ opacity: 0.28 })
);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);

/* ================= 贴图 ================= */
let tex1 = null, tex2 = null;
const maxAniso = renderer.capabilities.getMaxAnisotropy();
const texLoader = new THREE.TextureLoader();

function makeTex(url, cb) {
  texLoader.load(url, t => {
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
    t.anisotropy = maxAniso;
    cb(t);
  });
}
// 替换 / 清空槽位贴图：必须先 dispose 旧纹理。
// 反复上传或反复导入配置时，旧 Texture 会一直占着显存（GPU 侧不会随 JS 引用消失自动回收）。
// 调用方需在之后触发 rebuild()，使材质重新绑定新 map（旧 map 已被释放）。
function setTex(slot, t) {
  if (slot === 1) { if (tex1) tex1.dispose(); tex1 = t; }
  else { if (tex2) tex2.dispose(); tex2 = t; }
}
function clearTex(slot) {
  if (slot === 1) { if (tex1) tex1.dispose(); tex1 = null; }
  else { if (tex2) tex2.dispose(); tex2 = null; }
}
const WRAP_MODES = {
  clamp: THREE.ClampToEdgeWrapping,    // 不重复，边缘颜色延伸
  cutout: THREE.ClampToEdgeWrapping,   // 不重复，超出部分镂空（透出底色）
  repeat: THREE.RepeatWrapping,
  mirror: THREE.MirroredRepeatWrapping,
};
function applyTexParams(t, p) {
  if (!t) return;
  const w = WRAP_MODES[p.wrap] || THREE.ClampToEdgeWrapping;
  t.wrapS = t.wrapT = w;
  t.center.set(0.5, 0.5);
  const a0 = t.image && t.image.height ? t.image.width / t.image.height : 1;
  const a = a0 * (p.asp || 1);
  const fx = a >= 1 ? 1 / a : 1;
  const fy = a >= 1 ? 1 : a;
  t.repeat.set(p.s * fx, p.s * fy);
  t.offset.set(p.ox + (1 - p.s * fx) / 2, p.oy + (1 - p.s * fy) / 2);
  t.rotation = THREE.MathUtils.degToRad(p.r);
  t.needsUpdate = true;
}
function refreshTextures() {
  applyTexParams(tex1, P.t1);
  applyTexParams(tex2, P.t2);
  rebuildWristMat();
}

/* ================= 几何 ================= */
let padMesh = null, wristGroup = null;
const allMats = [];

function regMat(m) { allMats.push(m); m.envMapIntensity = P.env; return m; }
// 注销并释放材质：dispose 后必须同步移出 allMats，
// 否则数组随 rebuild() 无限增长（updateLights 每次遍历全量写 envMapIntensity），
// 形成内存 + 遍历开销双重泄漏（实测 30 次 rebuild：allMats 2 → 62）。
function unregMat(m) {
  if (!m) return;
  const i = allMats.indexOf(m);
  if (i >= 0) allMats.splice(i, 1);
  m.dispose();
}

// 经典款的垫身总长为派生值：腕托足迹（含 overhang）纵向跨度 + 腕托顶距。
// 缓存由 makeClassicShape() 每次重建时写入，其余消费点（UV/zBase）统一读取，
// 保证同一帧内几何与贴图坐标一致。
let classicPadHCache = null;
let classicZBaseCache = null;
function padHeight() {
  return (P.shape === 'classic' && classicPadHCache != null) ? classicPadHCache : P.padH;
}
// 腕托中心的 z 基准：经典款取自轮廓推算结果，其余款式按总长居中推算
function wristZBase() {
  if (P.shape === 'classic' && classicZBaseCache != null) return classicZBaseCache;
  return padHeight() / 2 - P.wPos - P.wD / 2;
}

/* ---- 经典款上半轮廓的贝塞尔锚点 ----------------------------------------
   锚点为该轮廓的唯一真值。两端 pin 锚点由腕托足迹决定（不可拖），
   其余锚点自由编辑。烘焙只在「尚无锚点」或「腕托接缝已移动」时发生，
   因此用户拖出的形状不会被后续 rebuild 覆盖。                          */

// 由足迹接缝与顶部距离生成初始锚点：左接缝 → 左腰 → 左肩 → 顶 → 右肩 → 右腰 → 右接缝
function bakeClassicCtrl(pBL, pBR, dBLv, dBRv, topY) {
  const halfW = P.padW / 2;
  const yBL = pBL.y, yBR = pBR.y;
  const spanL = topY - yBL, spanR = topY - yBR;
  // 切线长度取相邻锚点间距的经验比例，保证初始形状即平滑饱满
  const mk = (x, y) => ({ x, y, h1: { x, y }, h2: { x, y } });
  const pts = [
    { ...mk(pBL.x, yBL), pin: true },
    mk(-halfW * 0.985, yBL + spanL * 0.34),          // 左腰
    mk(-halfW * 0.90, yBL + spanL * 0.72),           // 左肩
    mk(-halfW * 0.06, topY),                          // 顶（略偏左，符合人机工程）
    mk(halfW * 0.88, yBR + spanR * 0.70),            // 右肩
    mk(halfW * 0.97, yBR + spanR * 0.32),            // 右腰
    { ...mk(pBR.x, yBR), pin: true },
  ];
  // 端点切线：严格继承足迹端点切线做 G1 衔接（左右对称，数学正确）。
  // 底轮廓在端点处的切向与上半轮廓起点切向天然反向（闭曲线），故取 -dBLv / -dBRv。
  autoSmoothClassicCtrl(pts);
  const n = pts.length - 1;
  const t0 = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) * 0.42;
  pts[0].h2 = { x: pts[0].x - dBLv.x * t0, y: pts[0].y - dBLv.y * t0 };
  const tN = Math.hypot(pts[n - 1].x - pts[n].x, pts[n - 1].y - pts[n].y) * 0.42;
  pts[n].h1 = { x: pts[n].x - dBRv.x * tN, y: pts[n].y - dBRv.y * tN };
  return pts;
}

// 按 Catmull-Rom 切线为每个中间锚点生成一对共线手柄 → 初始曲线自动平滑
function autoSmoothClassicCtrl(pts) {
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    const a = pts[i - 1] || p, b = pts[i + 1] || p;
    const tx = (b.x - a.x) * 0.5, ty = (b.y - a.y) * 0.5;
    const dPrev = Math.hypot(p.x - a.x, p.y - a.y);
    const dNext = Math.hypot(b.x - p.x, b.y - p.y);
    const L = Math.hypot(tx, ty) || 1;
    const k1 = Math.min(dPrev * 0.42, L) / L;
    const k2 = Math.min(dNext * 0.42, L) / L;
    p.h1 = { x: p.x - tx * k1, y: p.y - ty * k1 };
    p.h2 = { x: p.x + tx * k2, y: p.y + ty * k2 };
  }
}

// 取得当前锚点；pin 锚点始终跟随腕托足迹，其余保持用户编辑结果
function ensureClassicCtrl(pBL, pBR, dBLv, dBRv, topY) {
  let c = P.classicCtrl;
  const stale = !Array.isArray(c) || c.length < 3
    || !c[0] || !c[c.length - 1]
    || c.some(p => !p
        || !Number.isFinite(p.x) || !Number.isFinite(p.y)
        || ((p.h1 || p.h2) && (!p.h1 || !p.h2
            || !Number.isFinite(p.h1.x) || !Number.isFinite(p.h1.y)
            || !Number.isFinite(p.h2.x) || !Number.isFinite(p.h2.y))));
  if (stale) {
    P.classicCtrl = bakeClassicCtrl(pBL, pBR, dBLv, dBRv, topY);
    return P.classicCtrl;
  }
  // 腕托尺寸/位置变化时，仅平移两端 pin 锚点并重算其切线，中间锚点不动
  const first = c[0], last = c[c.length - 1];
  const moveEnd = (p, target, dir, neighbor, isFirst) => {
    if (Math.abs(p.x - target.x) < 1e-6 && Math.abs(p.y - target.y) < 1e-6) return;
    p.x = target.x; p.y = target.y;
    const t = Math.hypot(neighbor.x - p.x, neighbor.y - p.y) * 0.42;
    const h = { x: p.x - dir.x * t, y: p.y - dir.y * t };
    if (isFirst) p.h2 = h; else p.h1 = h;
  };
  moveEnd(first, pBL, dBLv, c[1], true);
  moveEnd(last, pBR, dBRv, c[c.length - 2], false);
  first.pin = last.pin = true;
  // 中间“接缝”类锚点（设计稿可能只存 p、无 h1/h2）补一对平滑共线手柄，
  // 避免 makeClassicShape() 的贝塞尔链读到 undefined 手柄。
  for (let i = 1; i < c.length - 1; i++) {
    const p = c[i];
    if (p.h1 && p.h2) continue;
    const a = c[i - 1] || p, b = c[i + 1] || p;
    const tx = (b.x - a.x) * 0.5, ty = (b.y - a.y) * 0.5;
    const L = Math.hypot(tx, ty) || 1;
    const k1 = Math.min(Math.hypot(p.x - a.x, p.y - a.y) * 0.42, L) / L;
    const k2 = Math.min(Math.hypot(b.x - p.x, b.y - p.y) * 0.42, L) / L;
    p.h1 = { x: p.x - tx * k1, y: p.y - ty * k1 };
    p.h2 = { x: p.x + tx * k2, y: p.y + ty * k2 };
  }
  return c;
}

// 经典款：轮廓 = 贴合腕托的等距底部曲线 + 平滑侧边/顶部
// 底部严格沿腕托的肾形/双球变形几何外扩 wMargin（原样折线，保留球间凹槽）；
// 侧边与顶部由一条经过「腰点—肩点—顶点」控制点的向心 Catmull-Rom 样条生成，
// 端点切线与底部足迹衔接（G1 连续），整体曲率平缓、无折角
function makeClassicShape() {
  const M = P.wMargin;
  // 阶段一：在「腕托中心为原点」的局部坐标系内计算足迹（zBase=0），
  // 足迹完成后由腕托顶 + wristTopGap 推出总长，再整体平移到最终坐标系。
  const zBase = 0;

  const bottomPts = [];
  const BSTEPS = 100;
  let rawEdgeL = null; // 未加 overhang 的腕托原始侧缘 x（用于腰线基准）
  let rawEdgeR = null;

  // 采样某一腕托轮廓的“原始足迹”（未经 overhang 偏移），按 右→左 顺序返回 [{x, z}]。
  // 变换链必须与 3D 腕托严格一致：单位球 → 变形 → 按半轴缩放 → 绕 y 轴旋转。
  // Three.js 局部矩阵为 T·R·S（先缩放后旋转）；旧实现在单位空间里「先旋转后缩放」，
  // 对非圆截面（rx≠rz）会产生与真实 cushion 完全不同的轮廓，旋转角越大偏差越大。
  // opts：kind==='ball' 传 {rot: 弧度, ox: 球心 x 偏移}；noRot=true 时忽略旋转角
  //       （用于推算与旋转无关的布局基准，见 buildFootprint）
  function wristFootprint(kind, opts = {}) {
    const raw = [];
    if (kind === 'full') {
      const rx = P.wW / 2, ry = P.wD / 2, k = P.wMorph;
      const rad = opts.noRot ? 0 : THREE.MathUtils.degToRad(P.wMorphRot || 0);
      const c = Math.cos(rad), s = Math.sin(rad);
      // 足迹取「垫身坐标系下最左/最右两点之间、且经过最前端」的那半条轮廓：
      // 未旋转时即 t∈[0,π]；旋转后轮廓最宽点随之偏移 t0，两端接缝仍落在最宽处，
      // 否则旋转后会把侧缘切掉或留下缺口（t0 处 x 取极值，恒为正 → 起点是最右点）
      const t0 = Math.atan2(ry * s, rx * c);
      for (let i = 0; i <= BSTEPS; i++) {
        const t = t0 + (i / BSTEPS) * Math.PI;     // 右→左沿前半圈
        const x0u = Math.cos(t), z0u = Math.sin(t);
        // 标准朝向先变形（肾型形状固定），旋转在缩放之后统一施加
        let x1u = x0u, z1u = z0u;
        if (k > 0) {
          const g = Math.exp(-((x0u / 0.55) ** 2));
          const front = Math.max(0, z0u);
          z1u = z0u - k * 0.55 * g * front * front;
          x1u = x0u * (1 + k * 0.12);
        }
        const px = x1u * rx, pz = z1u * ry;        // 缩放（mesh.scale）
        raw.push({ x: c * px + s * pz,             // 绕 y 旋转，与 wristGroup.rotation.y 同向
                   z: -s * px + c * pz });
      }
    } else if (kind === 'ball') {
      // 单个双球：单位球 → 鹅蛋变形 → 缩放 → 绕 y 旋 wRot → 平移
      const sx = P.wBW / 2, sz = P.wD / 2, e = P.wEgg;
      const rad = opts.noRot ? 0 : (opts.rot || 0);
      const c = Math.cos(rad), s = Math.sin(rad);
      const ox = opts.ox || 0;
      for (let i = 0; i <= BSTEPS; i++) {
        const t = (i / BSTEPS) * Math.PI;          // 0..π，右→左沿前半圆
        let xu = Math.cos(t), zu = Math.sin(t);
        if (e) xu *= (1 + e * zu);                 // 鹅蛋：x 随 z 缩放
        const px = xu * sx, pz = zu * sz;          // 缩放（mesh.scale）
        raw.push({ x: ox + (c * px + s * pz),      // 绕 y 旋转（mesh.rotation.y）
                   z: -s * px + c * pz });
      }
    } else { // none：无腕托时用一段扁椭圆作为底边足迹（局部坐标，中心在原点）
      const rx = P.padW / 2, ry = P.padW * 0.25;
      for (let i = 0; i <= BSTEPS; i++) {
        const t = (i / BSTEPS) * Math.PI;
        raw.push({ x: Math.cos(t) * rx, z: Math.sin(t) * ry });
      }
    }
    return raw;
  }

  function segHit(a1, a2, b1, b2) {
    const d1x = a2.x - a1.x, d1y = a2.y - a1.y;
    const d2x = b2.x - b1.x, d2y = b2.y - b1.y;
    const den = d1x * d2y - d1y * d2x;
    if (Math.abs(den) < 1e-12) return null;
    const t = ((b1.x - a1.x) * d2y - (b1.y - a1.y) * d2x) / den;
    const s = ((b1.x - a1.x) * d1y - (b1.y - a1.y) * d1x) / den;
    return (t > 1e-6 && t < 1 - 1e-6 && s > 1e-6 && s < 1 - 1e-6)
      ? { x: a1.x + d1x * t, y: a1.y + d1y * t } : null;
  }

  // 偏移折线去环：交叉时保留最外圈（修复凹槽附近偏移自交）
  function removeOffsetLoops(pts) {
    for (let pass = 0; pass < 6; pass++) {
      let done = true;
      outer:
      for (let i = 0; i < pts.length - 1; i++) {
        for (let j = i + 2; j < pts.length - 1; j++) {
          const hit = segHit(pts[i], pts[i + 1], pts[j], pts[j + 1]);
          if (hit) {
            pts.splice(i + 1, j - i, hit);
            done = false;
            break outer;
          }
        }
      }
      if (done) break;
    }
  }

  // 把“原始足迹”沿曲线法向向外偏移 M，写入 out
  // raw 必须按 右→左 顺序排列（out[0] 为右下，末尾为左下）
  function offsetFootprint(raw, pushEdges, out) {
    for (let i = 0; i < raw.length; i++) {
      const p = raw[i];
      const prev = raw[Math.max(0, i - 1)];
      const next = raw[Math.min(raw.length - 1, i + 1)];
      const dx = next.x - prev.x;
      const dz = next.z - prev.z;
      const len = Math.hypot(dx, dz) || 1;
      let nx = dz / len, nz = -dx / len;
      const rlen = Math.hypot(p.x, p.z) || 1;
      if (nx * (p.x / rlen) + nz * (p.z / rlen) < 0) { nx = -nx; nz = -nz; }
      out.push({ x: p.x + nx * M, y: -(zBase + p.z + nz * M) });
    }
    if (pushEdges) {
      rawEdgeR = raw[0].x;
      rawEdgeL = raw[raw.length - 1].x;
    }
    removeOffsetLoops(out);
  }

  // 生成一段完整足迹折线（含 overhang 偏移）写入 out。
  // noRot=true 时按“未旋转”状态生成，只用于推算与旋转角无关的布局基准
  // （垫身总长 + 腕托前后位置），使旋转腕托不再牵动整垫尺寸与腕托位移。
  function buildFootprint(out, noRot) {
    if (P.wristStyle === 'full') {
      offsetFootprint(wristFootprint('full', { noRot }), !noRot, out);
    } else if (P.wristStyle === 'balls') {
      const rot = noRot ? 0 : THREE.MathUtils.degToRad(P.wRot);
      const half = P.wGap / 2;
      const rxb = P.wBW / 2;
      // 右球：右→左；左球：右→左
      const rightBall = wristFootprint('ball', { rot: -rot, ox: half, noRot });
      const leftBall  = wristFootprint('ball', { rot:  rot, ox: -half, noRot });

      // 足迹曲线 i 点的前向切线（中心差分）
      function tanAt(arr, i) {
        const a = arr[Math.max(0, i - 1)], b = arr[Math.min(arr.length - 1, i + 1)];
        const l = Math.hypot(b.x - a.x, b.z - a.z) || 1;
        return { x: (b.x - a.x) / l, z: (b.z - a.z) / l };
      }

      // 双球间过渡弧：以两端切线做三次 Hermite 桥，替换/连接两侧弧段
      // kA/kB = 每侧被替换的采样数（0=保留原始相交尖角）
      // n = 桥采样密度
      function bridge(rawR, iA, rawL, iB, kA, kB, n) {
        const A = rawR[iA], B = rawL[iB];
        const mA = tanAt(rawR, iA), mB = tanAt(rawL, iB);
        // 切线臂长 ≈ 被替换的弧弦长，且不超过两端距离的一半
        const chordAB = Math.hypot(B.x - A.x, B.z - A.z);
        const armA = Math.min(Math.hypot(rawR[Math.min(iA + kA, BSTEPS)].x - A.x,
                                          rawR[Math.min(iA + kA, BSTEPS)].z - A.z) * 0.9,
                              chordAB * 0.45);
        const armB = Math.min(Math.hypot(rawL[Math.max(iB - kB, 0)].x - B.x,
                                          rawL[Math.max(iB - kB, 0)].z - B.z) * 0.9,
                              chordAB * 0.45);
        const bpts = [];
        for (let j = 1; j <= n; j++) {
          const t = j / (n + 1), u = 1 - t;
          bpts.push({
            x: u*u*u*A.x + 3*u*u*t*(A.x + mA.x*armA) + 3*u*t*t*(B.x - mB.x*armB) + t*t*t*B.x,
            z: u*u*u*A.z + 3*u*u*t*(A.z + mA.z*armA) + 3*u*t*t*(B.z - mB.z*armB) + t*t*t*B.z,
          });
        }
        return { pts: bpts };
      }

      let raw;
      if (half < rxb) {
        // 两球重叠：找两曲线最近点对作为交接处
        let bi = 0, bj = 0, bd = Infinity;
        for (let i = 0; i <= BSTEPS; i++) {
          for (let j = 0; j <= BSTEPS; j++) {
            const dx = rightBall[i].x - leftBall[j].x;
            const dz = rightBall[i].z - leftBall[j].z;
            const dd = dx * dx + dz * dz;
            if (dd < bd) { bd = dd; bi = i; bj = j; }
          }
        }
        // 用独立过渡弧替换交点附近的原始相交尖角
        const wJoin = P.wJoin != null ? P.wJoin : 16;
        if (wJoin > 0 && bi >= 2 && bj <= BSTEPS - 2) {
          const kA = Math.min(wJoin, bi - 1);
          const kB = Math.min(wJoin, BSTEPS - 1 - bj);
          const br = bridge(rightBall, bi - kA, leftBall, bj + kB, kA, kB, Math.max(10, kA));
          raw = rightBall.slice(0, bi - kA + 1).concat(br.pts, leftBall.slice(bj + kB));
        } else {
          raw = rightBall.slice(0, bi + 1).concat(leftBall.slice(bj));
        }
      } else {
        // 两球分离：同样插入一段独立过渡弧连接两球边缘
        const wJoin = P.wJoin != null ? P.wJoin : 16;
        const kSep = Math.max(2, Math.min(30, Math.round(BSTEPS * wJoin / 16 * 0.12)));
        if (wJoin > 0 && BSTEPS - kSep >= 1 && kSep <= BSTEPS - 1) {
          // 从两球相向端各回退若干采样，用过渡弧连接
          const br = bridge(rightBall, BSTEPS - kSep, leftBall, kSep, kSep, kSep,
                            Math.max(12, kSep));
          raw = rightBall.slice(0, BSTEPS - kSep + 1).concat(br.pts, leftBall.slice(kSep));
        } else {
          raw = rightBall.concat(leftBall);
        }
      }
      offsetFootprint(raw, !noRot, out);
    } else {
      offsetFootprint(wristFootprint('none'), !noRot, out);
    }
  }
  buildFootprint(bottomPts, false);

  // 阶段二：由腕托足迹推算总长，并把足迹平移到最终坐标系（原点=垫身中心）。
  // 局部坐标下 bottomPts.y = -(足迹 z)，故足迹最靠顶部处 y 最小、最靠底边处 y 最大。
  // ⚠️ 布局基准一律取「未旋转」的足迹（buildFootprint(_, true)）：旋转只改变包裹轮廓的
  // 外形，不再改变垫身总长与腕托前后位置。旧实现直接用旋转后足迹的纵向跨度反推总长，
  // 而该跨度随旋转角变化（侧缘点绕中心摆动）→ 垫身被拉长/缩短、腕托整体前后平移。
  const refPts = [];
  buildFootprint(refPts, true);
  let refYMin = Infinity, refYMax = -Infinity;
  for (const p of refPts) {
    if (p.y < refYMin) refYMin = p.y;
    if (p.y > refYMax) refYMax = p.y;
  }
  const gapTop = Math.max(1, P.wristTopGap);
  const padH = (refYMax + P.wPos) - (refYMin - gapTop);
  classicPadHCache = padH;
  // 平移：腕托最底端到底边保留 wPos 的距离
  const dy = (-padH / 2 + P.wPos) - refYMax;
  // 导出腕托中心的 z 基准，供腕托实体摆放复用，确保与轮廓严格同源
  classicZBaseCache = -dy;
  for (const p of bottomPts) p.y += dy;

  const pBR = bottomPts[0];
  const pBL = bottomPts[bottomPts.length - 1];

  const topY = padH / 2;

  // 底部足迹两端切线：统一取“离开端点沿底轮廓向内”的方向（右→左）。
  // dBRv 原已是 pBR → bottomPts[1]（朝下），dBLv 需取 pBL → bottomPts[n-2]（朝下），
  // 使左右端点的上半轮廓切线同为朝上，视觉对称圆润。
  const dBLv = norm2(bottomPts[bottomPts.length - 2].x - pBL.x,
                     bottomPts[bottomPts.length - 2].y - pBL.y);
  const dBRv = norm2(bottomPts[1].x - pBR.x, bottomPts[1].y - pBR.y);

  // ── 上半轮廓：三次贝塞尔锚点链 ──────────────────────────────────────────
  // 两端锚点（pin）钉在底部足迹接缝处，切线继承足迹方向以保证 G1 衔接；
  // 中间锚点自由可拖，形状完全由锚点与切线手柄决定（不再有顶部/腰部标量参数）。
  // 首次使用或腕托尺寸变化导致 pin 失配时，由 bakeClassicCtrl() 生成初始锚点。
  const ctrl = ensureClassicCtrl(pBL, pBR, dBLv, dBRv, topY);

  // 采样贝塞尔链：每段按弦长自适应细分，保证曲率大处足够密
  const outlinePts = [];
  for (let i = 0; i < ctrl.length - 1; i++) {
    const a = ctrl[i], b = ctrl[i + 1];
    const p0 = a, p1 = a.h2, p2 = b.h1, p3 = b;
    const chord = Math.hypot(p3.x - p0.x, p3.y - p0.y)
                + Math.hypot(p1.x - p0.x, p1.y - p0.y)
                + Math.hypot(p2.x - p1.x, p2.y - p1.y)
                + Math.hypot(p3.x - p2.x, p3.y - p2.y);
    const seg = Math.max(8, Math.min(64, Math.round(chord / 4)));
    for (let j = (i === 0 ? 0 : 1); j <= seg; j++) {
      const t = j / seg, u = 1 - t;
      outlinePts.push({
        x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
        y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y,
      });
    }
  }

  // 底部腕托包裹足迹：原样折线（保留球间凹槽特征）
  const footStart = outlinePts.length;
  for (let i = 1; i < bottomPts.length - 1; i++) outlinePts.push(bottomPts[i]);

  // 轻量拉普拉斯平滑：仅作用于足迹折线段，压平其残余锯齿。
  // 贝塞尔段是精确曲线，不参与平滑，否则会抹掉用户拖出的形状。
  for (let pass = 0; pass < 2; pass++) {
    for (let i = footStart; i < outlinePts.length - 1; i++) {
      const p = outlinePts[i];
      if (p.y < -55 && Math.abs(p.x) < 70) continue;   // 球间凹槽区不平滑
      const a = outlinePts[i - 1], b = outlinePts[i + 1];
      p.x += 0.25 * (a.x + b.x - 2 * p.x);
      p.y += 0.25 * (a.y + b.y - 2 * p.y);
    }
  }

  const s = new THREE.Shape();
  s.moveTo(outlinePts[0].x, outlinePts[0].y);
  for (let i = 1; i < outlinePts.length; i++) s.lineTo(outlinePts[i].x, outlinePts[i].y);
  s.closePath();
  return s;
}

function makeShape() {
  const w = P.padW / 2, h = P.padH / 2;
  const s = new THREE.Shape();
  if (P.shape === 'classic') return makeClassicShape();
  if (P.shape === 'ellipse') {
    s.absellipse(0, 0, w, h, 0, Math.PI * 2);
    return s;
  }
  if (P.shape === 'stadium') {
    const r = Math.min(w, h);
    s.absarc(0, h - r, r, 0, Math.PI);
    s.absarc(0, -(h - r), r, Math.PI, Math.PI * 2);
    s.closePath();
    return s;
  }
  const r = Math.min(P.corner, w, h);
  s.moveTo(-w + r, -h);
  s.lineTo(w - r, -h);  s.absarc(w - r, -h + r, r, -Math.PI / 2, 0);
  s.lineTo(w, h - r);   s.absarc(w - r, h - r, r, 0, Math.PI / 2);
  s.lineTo(-w + r, h);  s.absarc(-w + r, h - r, r, Math.PI / 2, Math.PI);
  s.lineTo(-w, -h + r); s.absarc(-w + r, -h + r, r, Math.PI, Math.PI * 1.5);
  return s;
}

// 世界坐标平面投影 UV：X/Z 用同一尺度，保证贴图渲染长宽比不随外形参数变化（cover 模式）
function uvScale() { return Math.max(P.padW, padHeight()); }
function planarUV(geo) {
  const S = uvScale();
  const pos = geo.attributes.position;
  const uv = new Float32Array(pos.count * 2);
  for (let i = 0; i < pos.count; i++) {
    uv[i * 2]     = pos.getX(i) / S + 0.5;
    uv[i * 2 + 1] = 0.5 - pos.getZ(i) / S;
  }
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
}

// 贴图与本色作为两个独立图层，用标准 over 合成：
//   本色层 alpha = uBaseOpacity（本色不透明度）
//   贴图层 alpha = texelColor.a * uTexOpacity（贴图自身 alpha × 贴图不透明度）
// 两者互不干扰，贴图 alpha 用于融合
function patchMapBlend(mat, modeGetter) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uCutout = { value: modeGetter() === 'cutout' ? 1 : 0 };
    sh.uniforms.uTexOpacity = { value: P.texOpacity };
    sh.uniforms.uBaseOpacity = { value: P.matOpacity };
    mat.userData.shader = sh;
    sh.fragmentShader = ('uniform float uCutout;\nuniform float uTexOpacity;\nuniform float uBaseOpacity;\n' + sh.fragmentShader).replace(
      '#include <map_fragment>',
      `#ifdef USE_MAP
        vec4 texelColor = texture2D( map, vMapUv );
        if ( uCutout > 0.5 && ( vMapUv.x < 0.0 || vMapUv.x > 1.0 || vMapUv.y < 0.0 || vMapUv.y > 1.0 ) ) texelColor = vec4( 0.0 );
        float texA  = texelColor.a * uTexOpacity;   // 贴图层有效不透明度
        float baseA = uBaseOpacity;                 // 本色层不透明度
        float outA  = texA + baseA * ( 1.0 - texA ); // 合成总不透明度
        vec3  outRGB = ( texelColor.rgb * texA + diffuseColor.rgb * baseA * ( 1.0 - texA ) ) / max( outA, 1e-4 );
        diffuseColor = vec4( outRGB, outA );
      #endif`
    );
  };
}
function blendMat(map, modeGetter, rough) {
  const m = regMat(new THREE.MeshStandardMaterial({
    map, roughness: rough,
    color: new THREE.Color(P.matColor),
    opacity: 1,                                  // 整体不透明度由 uBaseOpacity 控制
    transparent: P.matOpacity < 0.999 || P.texOpacity < 0.999,
  }));
  patchMapBlend(m, modeGetter);
  return m;
}
let padTopMat = null;
let edgeMat = null;
const baseTopMat  = () => { padTopMat = blendMat(tex1, () => P.t1.wrap, P.rough); return padTopMat; };
const baseEdgeMat = () => {
  if (P.edgeSame) {
    // 与上表面共享同一材质（含贴图与本色），整体着色
    edgeMat = padTopMat;
  } else {
    edgeMat = regMat(new THREE.MeshStandardMaterial({ color: new THREE.Color(P.edgeColor), roughness: 0.85 }));
  }
  return edgeMat;
};
// 底色/透明度实时更新（无需重建几何）
function updateMatBase() {
  const wantTransparent = P.matOpacity < 0.999 || P.texOpacity < 0.999;
  const mats = [padTopMat, wristMat];
  // edgeSame 时边缘与上表面共用同一材质，无需单独处理
  if (P.edgeSame && edgeMat && edgeMat !== padTopMat) mats.push(edgeMat);
  mats.forEach(m => {
    if (!m) return;
    m.color.set(P.matColor);
    const wasTransparent = m.transparent;
    m.transparent = wantTransparent;
    if (m.transparent !== wasTransparent) m.needsUpdate = true;
    if (m.userData.shader) {
      m.userData.shader.uniforms.uTexOpacity.value = P.texOpacity;
      m.userData.shader.uniforms.uBaseOpacity.value = P.matOpacity;
    }
  });
}

function buildPad() {
  if (padMesh) {
    scene.remove(padMesh);
    padMesh.geometry.dispose();
    // edgeSame 时顶/边共用同一材质实例，先去重再注销，避免重复 dispose
    [...new Set(padMesh.material)].forEach(unregMat);
  }
  const geo = new THREE.ExtrudeGeometry(makeShape(), {
    depth: P.thick,
    bevelEnabled: P.bevel > 0,   // 编辑轮廓时也保留真实倒角立体感（顶面边界仍与 shape 1:1 重合）
    bevelThickness: P.bevel,
    bevelSize: P.bevel * 0.9,
    bevelSegments: 5,
    curveSegments: 72,
  });
  geo.translate(0, 0, -P.thick / 2);
  geo.rotateX(-Math.PI / 2);
  planarUV(geo);

  padMesh = new THREE.Mesh(geo, [baseTopMat(), baseEdgeMat()]);   // [0]=顶面, [1]=边缘
  padMesh.castShadow = padMesh.receiveShadow = true;
  scene.add(padMesh);

  const bottom = -(P.thick / 2 + P.bevel);
  shadowPlane.position.y = bottom - 0.2;
  return P.thick / 2 + P.bevel; // 顶面高度
}

let wristMat = null;
function rebuildWristMat() {
  const map = tex2 || tex1;
  if (wristMat) { wristMat.map = map; wristMat.needsUpdate = true; }
}

// 椭球 → 肾型 连续变形（k: 0..1）。肾型形状固定为"凹陷朝使用者一侧（z+ 方向）"，
// 整体朝向旋转由 wristGroup.rotation.y 承担，故此处只做标准朝向的变形。
function deformKidney(geo, k) {
  if (k <= 0) return;
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x0 = pos.getX(i), y0 = pos.getY(i), z0 = pos.getZ(i);
    const front = Math.max(0, z0);
    const g = Math.exp(-((x0 / 0.55) ** 2));  // 中央高斯凹陷
    let z1 = z0 - k * 0.55 * g * front * front;
    let x1 = x0 * (1 + k * 0.12);             // 两瓣微微外扩
    pos.setXYZ(i, x1, y0, z1);
  }
  geo.computeVertexNormals();
}

// 椭球 → 鹅蛋形（e: -0.45..0.45，沿 z 轴一头大一头小）
function deformEgg(geo, e) {
  if (Math.abs(e) < 1e-4) return;
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const f = 1 + e * pos.getZ(i);
    pos.setX(i, pos.getX(i) * f);
    pos.setY(i, pos.getY(i) * f);
  }
  geo.computeVertexNormals();
}

function buildWrist(topY) {
  if (wristGroup) {
    scene.remove(wristGroup);
    wristGroup.children.forEach(c => c.geometry.dispose());
  }
  // 无论款式如何都要注销旧腕托材质；切到「无腕托」时若漏掉，材质会一直滞留在 allMats 与显存中
  if (wristMat) { unregMat(wristMat); wristMat = null; }
  wristGroup = new THREE.Group();
  wristGroup.visible = true;   // 编辑模式下也显示腕托，以呈现真实渲染状况（覆盖层在 DOM 顶层，仍可拖拽）
  if (P.wristStyle !== 'none') {
    // 裁剪掉低于鼠标垫下表面的部分
    const clip = new THREE.Plane(new THREE.Vector3(0, 1, 0), P.thick / 2 + P.bevel + 0.01);
    wristMat = blendMat(tex2 || tex1, () => (tex2 ? P.t2 : P.t1).wrap, Math.min(1, P.rough + 0.1));
    wristMat.clippingPlanes = [clip];

    const ry = P.wH * 1.5;
    const cy = topY - P.wH * 0.5;
    const mk = (sx, sz, x, z, rotY = 0) => {
      const g = new THREE.SphereGeometry(1, 72, 48);
      const m = new THREE.Mesh(g, wristMat);
      m.scale.set(sx, ry, sz);
      m.rotation.y = rotY;
      m.position.set(x, cy, z);
      m.castShadow = m.receiveShadow = true;
      wristGroup.add(m);
      return m;
    };
    const zBase = wristZBase();
    // 把整体平移放到 group 上，子 mesh 用局部 z=0，
    // 这样 wristGroup.rotation.y 的旋转轴正好是腕托中心（X=0, Z=zBase）
    wristGroup.position.z = zBase;
    if (P.wristStyle === 'full') {
      const m = mk(P.wW / 2, P.wD / 2, 0, 0);
      deformKidney(m.geometry, P.wMorph);
      // 整体腕托绕竖直轴旋转（肾型形状不变，单纯旋转），轴过腕托中心
      wristGroup.rotation.y = THREE.MathUtils.degToRad(P.wMorphRot);
    } else {
      const rot = THREE.MathUtils.degToRad(P.wRot);
      const l = mk(P.wBW / 2, P.wD / 2, -P.wGap / 2, 0,  rot);
      const r = mk(P.wBW / 2, P.wD / 2,  P.wGap / 2, 0, -rot);
      deformEgg(l.geometry, P.wEgg);
      deformEgg(r.geometry, P.wEgg);
    }
    // 按世界坐标做平面投影 UV，使贴图与垫面连续且长宽比一致
    wristGroup.updateMatrixWorld(true);
    const S = uvScale();
    const v = new THREE.Vector3();
    wristGroup.children.forEach(m => {
      const pos = m.geometry.attributes.position;
      const uv = new Float32Array(pos.count * 2);
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i).applyMatrix4(m.matrixWorld);
        uv[i * 2]     = v.x / S + 0.5;
        uv[i * 2 + 1] = 0.5 - v.z / S;
      }
      m.geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    });
  }
  scene.add(wristGroup);
}

function rebuild() {
  const topY = buildPad();
  buildWrist(topY);
  markOverlayDirty();              // 几何变了：锚点世界坐标、顶面高度都可能跟着变
  if (curveEdit) setEditOrtho();   // 几何/尺寸变了，正交视口要跟着缩放
}

/* ================= 光照 ================= */
function updateLights() {
  hemiLight.intensity = P.hemi;
  keyLight.intensity = P.key;
  keyLight.color.set(P.lightColor);
  const az = THREE.MathUtils.degToRad(P.az), el = THREE.MathUtils.degToRad(P.el);
  keyLight.position.set(
    500 * Math.cos(el) * Math.sin(az),
    500 * Math.sin(el),
    500 * Math.cos(el) * Math.cos(az)
  );
  allMats.forEach(m => m.envMapIntensity = P.env);
  shadowPlane.visible = P.shadow;
}

/* ================= 背景 ================= */
function updateBackground() {
  if (P.transparent) {
    scene.background = null;
    renderer.setClearColor(0x000000, 0);
    stage.classList.add('checker');
  } else {
    scene.background = new THREE.Color(P.bg);
    stage.classList.remove('checker');
  }
}

const uiSyncers = []; // 控件同步器：导入配置后遍历刷新显示值
function slider(parent, label, min, max, step, get, set) {
  const row = document.createElement('div'); row.className = 'row';
  const lb = document.createElement('label'); lb.textContent = label;
  const inp = document.createElement('input');
  inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; inp.value = get();
  const val = document.createElement('span'); val.className = 'val'; val.textContent = get();
  inp.oninput = () => { set(parseFloat(inp.value)); val.textContent = inp.value; };
  uiSyncers.push(() => { inp.value = get(); val.textContent = get(); });
  row.append(lb, inp, val); parent.appendChild(row);
  return inp;
}
function colorRow(parent, label, get, set) {
  const row = document.createElement('div'); row.className = 'row';
  const lb = document.createElement('label'); lb.textContent = label;
  const inp = document.createElement('input'); inp.type = 'color'; inp.value = get();
  inp.oninput = () => set(inp.value);
  uiSyncers.push(() => { inp.value = get(); });
  row.append(lb, inp); parent.appendChild(row);
  return row;
}
function selectRow(parent, label, opts, get, set) {
  const row = document.createElement('div'); row.className = 'row';
  const lb = document.createElement('label'); lb.textContent = label;
  const sel = document.createElement('select');
  opts.forEach(([v, t]) => {
    const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o);
  });
  sel.value = get();
  sel.onchange = () => set(sel.value);
  uiSyncers.push(() => { sel.value = get(); });
  row.append(lb, sel); parent.appendChild(row);
  return sel;
}
function checkRow(parent, label, get, set) {
  const row = document.createElement('div'); row.className = 'row';
  const lb = document.createElement('label'); lb.textContent = label;
  const inp = document.createElement('input'); inp.type = 'checkbox'; inp.checked = get();
  inp.onchange = () => set(inp.checked);
  uiSyncers.push(() => { inp.checked = get(); });
  row.append(lb, inp); parent.appendChild(row);
  return row;
}
function btnRow(parent, label, text, onClick) {
  const row = document.createElement('div'); row.className = 'row';
  const lb = document.createElement('label'); lb.textContent = label;
  const b = document.createElement('button'); b.textContent = text;
  b.style.cssText = 'flex:1;padding:5px 10px;border:0;border-radius:5px;background:#3a4150;color:#e6e9ef;cursor:pointer';
  b.onclick = onClick;
  row.append(lb, b); parent.appendChild(row);
  return b;
}

/* ================= 上传 ================= */
function bindDropzone(dzId, fileId, onImg) {
  const dz = document.getElementById(dzId), fi = document.getElementById(fileId);
  dz.onclick = e => { if (!e.target.classList.contains('clear')) fi.click(); };
  fi.onchange = () => { if (fi.files[0]) loadImage(fi.files[0], onImg, dz); fi.value = ''; };
  // 「粘贴」按钮：主动读取剪贴板图片填入对应槽位（不依赖聚焦/右键，独立于预览区）
  const pbtn = document.getElementById('paste' + dzId.slice(2));
  if (pbtn) pbtn.onclick = async e => {
    e.stopPropagation();
    if (!navigator.clipboard || !navigator.clipboard.read) {
      toast('当前浏览器不支持主动读取剪贴板，请改用文件上传或拖拽。', 'err');
      return;
    }
    pbtn.disabled = true;
    try {
      const items = await navigator.clipboard.read();
      let file = null;
      for (const it of items) {
        const type = it.types.find(t => t.startsWith('image/'));
        if (type) { file = await it.getType(type); break; }
      }
      if (!file) { toast('剪贴板中没有图片。', 'err'); return; }
      loadImage(file, onImg, dz);
    } catch (err) {
      toast('无法读取剪贴板：' + (err && err.message ? err.message : err) + '（需用户已授权剪贴板读取权限）', 'err');
    } finally {
      pbtn.disabled = false;
    }
  };
}
function loadImage(file, onImg, dz) {
  const rd = new FileReader();
  rd.onload = () => onImg(rd.result, dz);
  rd.readAsDataURL(file);
}
/* 轻量 toast 提示（替代 alert）：type = 'ok' | 'err' | '' */
function toast(msg, type = '', ms = 2600) {
  let wrap = document.getElementById('toast-wrap');
  if (!wrap) { wrap = document.createElement('div'); wrap.id = 'toast-wrap'; document.body.appendChild(wrap); }
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  const remove = () => {
    el.classList.remove('show');
    el.addEventListener('transitionend', () => el.remove(), { once: true });
    setTimeout(() => el.remove(), 400);
  };
  el.addEventListener('click', remove);
  setTimeout(remove, ms);
}

const modeSeg = document.getElementById('modeSeg');
const modeHint = document.getElementById('modeHint');
let dragMode = 'view';

function setDragMode(m) {
  dragMode = m;
  controls.enabled = (m === 'view');
  canvas.style.cursor = m === 'view' ? '' : 'move';

    modeHint.style.display = 'block';
  }

  b.onclick = () => setDragMode(b.dataset.mode));

let panning = false, lastPX = 0, lastPY = 0;
canvas.addEventListener('pointerdown', e => {
  if (dragMode === 'view' || e.button !== 0) return;
  panning = true; lastPX = e.clientX; lastPY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!panning || dragMode === 'view') return;
  const tp = P[dragMode];
  const k = 1.5 / stage.clientHeight;   // 像素 → uv 偏移量
  tp.ox = THREE.MathUtils.clamp(tp.ox - (e.clientX - lastPX) * k, -1, 1);
  tp.oy = THREE.MathUtils.clamp(tp.oy + (e.clientY - lastPY) * k, -1, 1);
  lastPX = e.clientX; lastPY = e.clientY;
  refreshTextures(); syncTexUI(dragMode);
});
const endPan = () => panning = false;
canvas.addEventListener('pointerup', endPan);
canvas.addEventListener('pointercancel', endPan);
// 鼠标位置 → 垫面 UV（投射到顶面平面）
const raycaster = new THREE.Raycaster();
function uvAtPoint(e) {
  const r = canvas.getBoundingClientRect();
  const nx = ((e.clientX - r.left) / r.width) * 2 - 1;
  const ny = -((e.clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(new THREE.Vector2(nx, ny), camera);
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -(P.thick / 2 + P.bevel));
  const pt = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(plane, pt)) return null;
  const S = uvScale();
  return { u: pt.x / S + 0.5, v: 0.5 - pt.z / S };
}
// 以鼠标所在位置为锚点缩放贴图（锚点下的贴图像素保持不动）
function zoomTexAt(tp, t, e) {
  const ns = THREE.MathUtils.clamp(tp.s * Math.exp(-e.deltaY * 0.001), 0.2, 5);
  const m = uvAtPoint(e);
  if (!m || !t || !t.image) { tp.s = ns; return; }
  const a0 = t.image.height ? t.image.width / t.image.height : 1;
  const a = a0 * (tp.asp || 1);
  const fx = a >= 1 ? 1 / a : 1, fy = a >= 1 ? 1 : a;
  const rad = THREE.MathUtils.degToRad(tp.r);
  const c = Math.cos(rad), s = Math.sin(rad);
  // 贴图坐标 = R·S·(uv-0.5) + 0.5 + offset（与 three.js uvTransform 一致）
  const texelAt = (sc, ox, oy) => {
    const rx = sc * fx, ry = sc * fy;
    const du = (m.u - 0.5) * rx, dv = (m.v - 0.5) * ry;
    return {
      u: c * du + s * dv + 0.5 + ox + (1 - rx) / 2,
      v: -s * du + c * dv + 0.5 + oy + (1 - ry) / 2,
    };
  };
  const p = texelAt(tp.s, tp.ox, tp.oy);   // 当前锚点处的贴图坐标
  const rx2 = ns * fx, ry2 = ns * fy;
  const du2 = (m.u - 0.5) * rx2, dv2 = (m.v - 0.5) * ry2;
  // 反解新偏移，使缩放后锚点处贴图坐标不变
  const offU = p.u - (c * du2 + s * dv2 + 0.5);
  const offV = p.v - (-s * du2 + c * dv2 + 0.5);
  tp.s = ns;
  tp.ox = THREE.MathUtils.clamp(offU - (1 - rx2) / 2, -1, 1);
  tp.oy = THREE.MathUtils.clamp(offV - (1 - ry2) / 2, -1, 1);
}
canvas.addEventListener('wheel', e => {
  if (dragMode === 'view') return;
  e.preventDefault();
  const tp = P[dragMode];
  if (e.shiftKey) {
    tp.r = THREE.MathUtils.clamp(tp.r - e.deltaY * 0.1, -180, 180);
  } else {
    zoomTexAt(tp, dragMode === 't1' ? tex1 : tex2, e);
  }
  refreshTextures(); syncTexUI(dragMode);
}, { passive: false });

/* ================= 轮廓贝塞尔编辑 ================= */
/* 叠加层直接在预览画面上绘制并拖拽控制点。为避免透视畸变导致拖拽偏移，
   进入编辑时自动切到顶视；模型 XZ 平面与屏幕的映射由相机投影反算得到。   */
const curveLayer = document.getElementById('curveLayer');
const cctx = curveLayer.getContext('2d');
var curveEdit = false;       // var：UI 构建早于本模块，需避免 TDZ
let cvHover = null;          // {i, kind:'anchor'|'h1'|'h2'}
let cvDrag = null;
let prevViewPos = null;      // 进入编辑前的相机状态，退出时恢复
let overlayDirty = false;    // 脏标记：为真时主循环重绘一次叠加层（变化入口显式置脏）
let lastOverlayKey = '';     // 叠加层输入指纹：脏标记的兜底，防止漏置脏时锚点停在旧位置
let cvW = 0, cvH = 0;        // 叠加层 CSS 像素尺寸，由 resizeCurveLayer() 缓存（避免每帧读布局）

// 任何会改变叠加层画面的入口都要置脏：几何（rebuild）、视锥（setEditOrtho）、
// 画布尺寸与变换（resizeCurveLayer）。置脏只保证"尽快重绘"，不保证"不漏"，
// 漏置脏的兜底由 overlayKey() 指纹负责，二者缺一不可。
function markOverlayDirty() { overlayDirty = true; }

// 编辑态专用正交相机：根据 stage 当前宽高 + 鼠标垫世界包围计算 left/right/top/bottom，
// 让 Shape 坐标→屏幕坐标严格 1:1 映射，避免 Perspective 投影 + 退化 lookAt 带来的对位误差。
// up = (0, 0, -1) 使世界 -Z (即 Shape +Y) 投影到屏幕 +Y，腕托接缝在屏幕下沿，与默认透视视角一致。
function buildOrtho() {
  orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, -2000, 2000);
  orthoCam.up.set(0, 0, -1);
  orthoCam.position.set(0, 600, 0);
  orthoCam.lookAt(0, 0, 0);
  orthoCam.updateMatrixWorld(true);
}

function setEditOrtho() {
  if (!orthoCam) buildOrtho();
  // 用 makeClassicShape() 实际边界做正交视锥，使视锥中心对齐模型几何中心，
  // 视锥严格覆盖 shape bbox：长边等于 shape 对应方向半幅，短边方向按 stage aspect 反推（可能留白），
  // 视锥中心 = shape 几何中心。这样 mouse pad 居中显示，蓝线与 3D 模型像素级重合。
  const w = stage.clientWidth, h = stage.clientHeight;
  let cx = 0, cy = 0, halfX = 120, halfY = 120;
  try {
    const sh = makeClassicShape();
    const pts = sh.getPoints ? sh.getPoints(400) : [];
    if (pts.length) {
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const p of pts) {
        if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
      }
      cx = (minX + maxX) / 2;
      cy = (minY + maxY) / 2;
      halfX = (maxX - minX) / 2;
      halfY = (maxY - minY) / 2;
    }
  } catch (e) {}
  const aspect = w / h;
  // 取较大的那半幅作为视锥短边方向半幅（保证不裁剪），长边方向由 stage aspect 反推。
  // 乘 ZOOM_MARGIN 放大视锥，使模型在画布中留出余量，便于编辑贴边锚点。
  const ZOOM_MARGIN = 1.35;
  const baseHalf = Math.max(halfX, halfY) * ZOOM_MARGIN;
  if (aspect >= 1) {
    orthoCam.top = cy + baseHalf;
    orthoCam.bottom = cy - baseHalf;
    orthoCam.left = cx - baseHalf * aspect;
    orthoCam.right = cx + baseHalf * aspect;
  } else {
    orthoCam.left = cx - baseHalf;
    orthoCam.right = cx + baseHalf;
    orthoCam.top = cy + baseHalf / aspect;
    orthoCam.bottom = cy - baseHalf / aspect;
  }
  orthoCam.updateProjectionMatrix();
  orthoCam.updateMatrixWorld(true);
  markOverlayDirty();   // 视锥变了：锚点屏幕坐标必然变（含"只平移不缩放"的情形）
}

function setCurveEdit(on) {
  curveEdit = on && P.shape === 'classic';
  curveLayer.classList.toggle('on', curveEdit);
  // 编辑模式下隐藏腕托 cushion：它会完全遮住 padMesh 顶面，让用户看不到鼠标垫真实外形
  if (wristGroup) wristGroup.visible = true;
  // 先设置 flag 再 rebuild，使 buildPad() 根据 curveEdit 决定是否启用 bevel
  if (curveEdit) {
    prevViewPos = { pos: camera.position.clone(), tgt: controls.target.clone() };
    controls.enabled = false;
    setDragMode('view');
    modeHint.textContent = '编辑轮廓：拖圆点=移动锚点  拖方块=调切线  Shift=切线独立  双击=加点  右键=删点';
    modeHint.style.display = 'block';
    setEditOrtho();
    resizeCurveLayer();
    drawCurveOverlay();
  } else {
    if (prevViewPos) {
      camera.position.copy(prevViewPos.pos);
      controls.target.copy(prevViewPos.tgt);
      prevViewPos = null;
    }
    controls.enabled = true;
    modeHint.style.display = 'none';
    cvHover = cvDrag = null;
  }
  // 同步复选框显示状态
  document.querySelectorAll('#shapeCtrls input[type=checkbox]').forEach(cb => {
    if (cb.parentElement.textContent.includes('编辑轮廓')) cb.checked = curveEdit;
  });
  // 进入/退出编辑时重建网格：进入时关 bevel 让覆盖层与网格严格对齐；退出时恢复 bevel
  rebuild();
}

function resizeCurveLayer() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  // 缓存 CSS 尺寸：绘制与指纹都用它，保证两者读取的是同一个值，也免去每帧读布局
  cvW = stage.clientWidth; cvH = stage.clientHeight;
  curveLayer.width = cvW * dpr;
  curveLayer.height = cvH * dpr;
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  markOverlayDirty();   // 画布尺寸/变换变了：整层内容作废，必须重绘
}

// 模型形状坐标 (x, y) → 屏幕像素。
// Shape 在 XY 平面内被构造后由 geo.rotateX(-π/2) 放到世界 XZ 平面：
// 旋转矩阵 [x, y, z] → [x, z, -y]，故 Shape-Y 映射到世界 -Z。
// 编辑态下使用独立正交相机（orthoCam，up = world -Z），与 3D 渲染严格同源。
// 编辑模式下 ExtrudeGeometry 的 bevelEnabled=false（见 buildPad），
// 渲染顶面位于世界 Y = P.thick/2，与 makeShape() 边界严格重合，故投影取此值。
// 开启 bevel 后 ExtrudeGeometry 顶面位于世界 Y = P.thick/2 + P.bevel，
// 投影取此值才能使蓝色轮廓与渲染网格严格 1:1 重合。
const shapeTopY = () => P.thick / 2 + P.bevel;
function shapeToScreen(x, y) {
  const cam = orthoCam || camera;
  const v = new THREE.Vector3(x, shapeTopY(), -y).project(cam);
  // 用 resizeCurveLayer() 缓存的 cvW/cvH，与 drawCurveOverlay / overlayKey 严格同源
  return { x: (v.x * 0.5 + 0.5) * cvW,
           y: (-v.y * 0.5 + 0.5) * cvH };
}
// 屏幕像素 → 模型形状坐标（射线与顶面平面求交）
function screenToShape(e) {
  const r = curveLayer.getBoundingClientRect();
  const nx = ((e.clientX - r.left) / r.width) * 2 - 1;
  const ny = -((e.clientY - r.top) / r.height) * 2 + 1;
  const cam = orthoCam || camera;
  raycaster.setFromCamera(new THREE.Vector2(nx, ny), cam);
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -shapeTopY());
  const pt = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(plane, pt)) return null;
  let x = pt.x, y = -pt.z;
  return { x, y };
}

// 指纹量化：世界单位约等于 mm，取 1e-6 精度足够区分任何一次可见变化；NaN/undefined 归 0。
const ovQ = n => Math.round(n * 1e6) | 0;

// 叠加层重绘判据：把 drawCurveOverlay() 的**全部输入**压成一个字符串指纹。
// 旧实现只读 orthoCam.projectionMatrix.elements[0]（X 方向缩放），漏了两类变化：
//   1) 视锥只平移不缩放 —— 中心平移体现在 elements[12]/[13]，elements[0] 不变；
//   2) 几何变化 —— 锚点世界坐标、顶面高度 shapeTopY()（= P.thick/2 + P.bevel）与
//      投影矩阵无关，改这两个滑条时矩阵完全不变。
// 因此这里逐项列出：画布尺寸、视锥缩放与平移、顶面高度、hover 高亮、全部锚点几何。
// 只要 drawCurveOverlay 引入新的输入，必须同步加进指纹，否则会重新出现静默失效。
function overlayKey() {
  let s = cvW + 'x' + cvH + '|' + ovQ(shapeTopY()) + '|';
  if (orthoCam) {
    const e = orthoCam.projectionMatrix.elements;
    // [0]/[5] = X/Y 缩放，[12]/[13] = 视锥中心平移
    s += ovQ(e[0]) + ',' + ovQ(e[5]) + ',' + ovQ(e[12]) + ',' + ovQ(e[13]) + '|';
  }
  s += (cvHover ? cvHover.i + ':' + cvHover.kind : '-') + '|';
  const c = P.classicCtrl;
  if (!Array.isArray(c)) return s + 'null';
  for (let i = 0; i < c.length; i++) {
    const p = c[i], h1 = p.h1 || {}, h2 = p.h2 || {};
    s += (p.pin ? '1' : '0') + ovQ(p.x) + ovQ(p.y)
       + ovQ(h1.x) + ovQ(h1.y) + ovQ(h2.x) + ovQ(h2.y) + ';';
  }
  return s;
}

// 编辑模式叠加层：只画锚点 / 切线手柄，不画轮廓线。
// 轮廓形状直接由 3D 渲染结果呈现（改用渲染效果判断外观），叠加层只负责交互。
// 历史备注：此前曾从 padMesh 顶面提取闭合边界边绘制蓝色轮廓线，因与渲染外形重复而移除。
function drawCurveOverlay() {
  if (curveEdit && (!cvW || !cvH)) resizeCurveLayer();  // 兜底：进入编辑前画布尺寸尚未缓存
  overlayDirty = false;      // 无论是否真的绘制，脏标记在此消费掉
  lastOverlayKey = overlayKey();
  if (!curveEdit) return;
  const c = P.classicCtrl;
  cctx.clearRect(0, 0, cvW, cvH);
  if (!Array.isArray(c) || !c.length) return;

  // 手柄连线与控制点
  c.forEach((p, i) => {
    const a = shapeToScreen(p.x, p.y);
    if (!p.pin) {
      ['h1', 'h2'].forEach(k => {
        const h = shapeToScreen(p[k].x, p[k].y);
        cctx.beginPath(); cctx.moveTo(a.x, a.y); cctx.lineTo(h.x, h.y);
        cctx.strokeStyle = '#6b7480'; cctx.lineWidth = 1; cctx.stroke();
        const hot = cvHover && cvHover.i === i && cvHover.kind === k;
        cctx.beginPath(); cctx.rect(h.x - 5, h.y - 5, 10, 10);
        cctx.fillStyle = hot ? '#ffd166' : '#ff7a59'; cctx.fill();
      });
    }
    const hot = cvHover && cvHover.i === i && cvHover.kind === 'anchor';
    cctx.beginPath(); cctx.arc(a.x, a.y, p.pin ? 5 : 7, 0, Math.PI * 2);
    cctx.fillStyle = p.pin ? '#5a626e' : (hot ? '#ffd166' : '#12151a');
    cctx.fill();
    cctx.strokeStyle = p.pin ? '#7d8694' : '#4da3ff';
    cctx.lineWidth = 2; cctx.stroke();
  });
}

// 命中检测：优先手柄，其次锚点（屏幕空间距离，保证不同缩放下手感一致）
function curveHit(e) {
  const c = P.classicCtrl;
  if (!Array.isArray(c)) return null;
  const r = curveLayer.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const near = (s, d) => Math.hypot(s.x - mx, s.y - my) <= d;
  for (let i = 0; i < c.length; i++) {
    if (c[i].pin) continue;
    for (const k of ['h1', 'h2']) {
      if (near(shapeToScreen(c[i][k].x, c[i][k].y), 9)) return { i, kind: k };
    }
  }
  for (let i = 0; i < c.length; i++) {
    if (c[i].pin) continue;
    if (near(shapeToScreen(c[i].x, c[i].y), 11)) return { i, kind: 'anchor' };
  }
  return null;
}

curveLayer.addEventListener('pointerdown', e => {
  // 编辑态下 curveLayer 必须吞掉所有 pointer 事件，避免 OrbitControls 把相机拖离顶视图
  e.stopPropagation();
  if (e.button !== 0) return;
  const h = curveHit(e);
  if (!h) return;
  cvDrag = h;
  curveLayer.setPointerCapture(e.pointerId);
});

curveLayer.addEventListener('pointermove', e => {
  const c = P.classicCtrl;
  if (!Array.isArray(c)) return;
  if (!cvDrag) {
    const h = curveHit(e);
    const changed = JSON.stringify(h) !== JSON.stringify(cvHover);
    cvHover = h;
    curveLayer.style.cursor = h ? 'pointer' : 'crosshair';
    if (changed) drawCurveOverlay();
    return;
  }
  const m = screenToShape(e);
  if (!m) return;
  const p = c[cvDrag.i];
  if (cvDrag.kind === 'anchor') {
    const dx = m.x - p.x, dy = m.y - p.y;
    p.x = m.x; p.y = m.y;
    p.h1.x += dx; p.h1.y += dy;
    p.h2.x += dx; p.h2.y += dy;
  } else {
    p[cvDrag.kind].x = m.x; p[cvDrag.kind].y = m.y;
    // 默认对称联动保持切线共线（G1 平滑）；按住 Shift 可独立成折角
    if (!e.shiftKey) {
      const oth = cvDrag.kind === 'h1' ? 'h2' : 'h1';
      const len = Math.hypot(p[oth].x - p.x, p[oth].y - p.y);
      const d = Math.hypot(m.x - p.x, m.y - p.y) || 1;
      p[oth].x = p.x - (m.x - p.x) / d * len;
      p[oth].y = p.y - (m.y - p.y) / d * len;
    }
  }
  rebuild();
  drawCurveOverlay();
});

const endCurveDrag = () => { cvDrag = null; };
curveLayer.addEventListener('pointerup', endCurveDrag);
curveLayer.addEventListener('pointercancel', endCurveDrag);

// 双击加点：插到最近的曲线段中点
curveLayer.addEventListener('dblclick', e => {
  const c = P.classicCtrl;
  const m = screenToShape(e);
  if (!Array.isArray(c) || !m) return;
  let bi = 0, bd = Infinity;
  for (let i = 0; i < c.length - 1; i++) {
    const mx = (c[i].x + c[i + 1].x) / 2, my = (c[i].y + c[i + 1].y) / 2;
    const d = Math.hypot(mx - m.x, my - m.y);
    if (d < bd) { bd = d; bi = i; }
  }
  c.splice(bi + 1, 0, { x: m.x, y: m.y, h1: { x: m.x, y: m.y }, h2: { x: m.x, y: m.y } });
  // 仅对新点及其邻居重算切线，保持其他锚点的手动调整
  const seg = c.slice(Math.max(0, bi), Math.min(c.length, bi + 3));
  autoSmoothClassicCtrl(seg);
  rebuild(); drawCurveOverlay();
});

// 右键删点（pin 与保证至少 3 点的约束下）
curveLayer.addEventListener('contextmenu', e => {
  e.preventDefault();
  const c = P.classicCtrl;
  if (!Array.isArray(c) || c.length <= 3) return;
  const h = curveHit(e);
  if (!h || h.kind !== 'anchor' || c[h.i].pin) return;
  c.splice(h.i, 1);
  cvHover = null;
  rebuild(); drawCurveOverlay();
});

/* ================= 导出 ================= */
// 取当前渲染用的相机（编辑态用正交相机，否则透视相机），与动画循环保持一致
function activeCam() { return (curveEdit && orthoCam) ? orthoCam : camera; }

function exportPNG(opts) {
  const download = !opts || opts.download !== false;
  const scale = P.exportScale;
  const w = stage.clientWidth, h = stage.clientHeight;
  const useCam = activeCam();
  // 导出时临时套用导出透明设置，不改变预览状态
  const prevTransparent = P.transparent;
  if (P.exportTransparent !== P.transparent) {
    P.transparent = P.exportTransparent;
    updateBackground();
  }
  // 必须先置 pixelRatio=1：renderer.setSize 内部会再乘一次 pixelRatio，
  // 否则高分屏（dpr=2）上 2x 导出实际得到 4x、3x 得到 6x，极易超出浏览器画布上限。
  const prevPixelRatio = renderer.getPixelRatio();
  renderer.setPixelRatio(1);
  renderer.setSize(w * scale, h * scale, false);
  renderer.render(scene, useCam);
  const url = renderer.domElement.toDataURL('image/png');
  // 恢复预览状态
  if (P.exportTransparent !== prevTransparent) {
    P.transparent = prevTransparent;
    updateBackground();
  }
  // 恢复顺序：先按 CSS 尺寸 setSize（此时 pixelRatio 仍为 1，不产生超大中间画布），再恢复 pixelRatio
  renderer.setSize(w, h, false);
  renderer.setPixelRatio(prevPixelRatio);
  if (download) {
    const a = document.createElement('a');
    a.href = url; a.download = 'mousepad-3d-preview.png'; a.click();
  }
  return url;
}

/* 仅导出模型：自动取景到模型整体包围盒，背景始终透明，隐藏阴影平面 */
function exportModelPNG(opts) {
  const download = !opts || opts.download !== false;
  const scale = P.exportScale;
  const useCam = activeCam();
  // 整体包围盒：padMesh + wristGroup（不含阴影平面）
  const box = new THREE.Box3();
  if (padMesh) box.expandByObject(padMesh);
  if (wristGroup && wristGroup.visible) box.expandByObject(wristGroup);
  if (box.isEmpty()) { toast('模型尚未构建，无法导出', 'err'); return; }
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const margin = 1.06; // 轻微留白，避免边缘裁切

  // 保存原状态
  const prevTransparent = P.transparent;
  const prevShadow = shadowPlane.visible;
  // 与 exportPNG 同理：导出期间置 pixelRatio=1，避免倍率被 dpr 二次放大
  const prevPixelRatio = renderer.getPixelRatio();
  renderer.setPixelRatio(1);
  const persp = useCam.isPerspectiveCamera;
  let saved = null;
  if (persp) {
    saved = { pos: useCam.position.clone(), tgt: controls.target.clone() };
  } else {
    saved = { left: useCam.left, right: useCam.right, top: useCam.top, bottom: useCam.bottom };
  }

  // 强制透明背景（不改变 P.transparent，导出后恢复）
  P.transparent = true; updateBackground();
  shadowPlane.visible = false;

  // 计算相机取景，使模型居中充满画面
  if (persp) {
    const fitH = size.y * margin, fitW = size.x * margin;
    const vFov = THREE.MathUtils.degToRad(useCam.fov);
    const distH = (fitH / 2) / Math.tan(vFov / 2);
    const distW = (fitW / 2) / Math.tan(vFov / 2) / useCam.aspect;
    const dist = Math.max(distH, distW) + size.z * 0.5; // 视距叠加厚度方向余量
    const dir = useCam.position.clone().sub(controls.target).normalize();
    useCam.position.copy(center).add(dir.multiplyScalar(dist));
    controls.target.copy(center);
    useCam.updateMatrixWorld(true);
    // 导出尺寸按模型宽高比，避免多余背景区域
    const aspect = fitW / fitH;
    const outH = Math.max(2, Math.round(stage.clientHeight * scale));
    const outW = Math.max(2, Math.round(outH * aspect));
    useCam.aspect = aspect; useCam.updateProjectionMatrix();
    renderer.setSize(outW, outH, false);
  } else {
    const halfX = (size.x * margin) / 2, halfY = (size.y * margin) / 2;
    const aspect = halfX / halfY;
    if (aspect >= 1) {
      useCam.top = center.z + halfY; useCam.bottom = center.z - halfY;
      useCam.left = center.x - halfX * aspect; useCam.right = center.x + halfX * aspect;
    } else {
      useCam.left = center.x - halfX; useCam.right = center.x + halfX;
      useCam.top = center.z + halfY / aspect; useCam.bottom = center.z - halfY / aspect;
    }
    useCam.updateProjectionMatrix(); useCam.updateMatrixWorld(true);
    const outH = Math.max(2, Math.round(stage.clientHeight * scale));
    const outW = Math.max(2, Math.round(outH * (halfX / halfY)));
    renderer.setSize(outW, outH, false);
  }

  renderer.render(scene, useCam);

  const url = renderer.domElement.toDataURL('image/png');

  // 恢复预览状态
  restore();
  if (download) {
    const a = document.createElement('a');
    a.href = url; a.download = 'mousepad-3d-model.png'; a.click();
  }
  return url;

  function restore() {
    P.transparent = prevTransparent; updateBackground();
    shadowPlane.visible = prevShadow;
    if (persp) {
      useCam.position.copy(saved.pos);
      controls.target.copy(saved.tgt);
      useCam.aspect = stage.clientWidth / stage.clientHeight;
      useCam.updateProjectionMatrix();
    } else {
      useCam.left = saved.left; useCam.right = saved.right;
      useCam.top = saved.top; useCam.bottom = saved.bottom;
      useCam.updateProjectionMatrix();
    }
    renderer.setSize(stage.clientWidth, stage.clientHeight, false);
    renderer.setPixelRatio(prevPixelRatio);
  }
}

/* ================= 配置导入 / 导出 ================= */
// —— 最小 ZIP（store 模式，无压缩，零依赖）+ CRC32 ——
const crcTable = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = crcTable[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
// 大数组安全转 base64（避免 String.fromCharCode(...大数组) 栈溢出）
function b64FromBytes(u8) {
  let s = ''; const CHUNK = 0x8000;
  for (let i = 0; i < u8.length; i += CHUNK) s += String.fromCharCode.apply(null, u8.subarray(i, i + CHUNK));
  return btoa(s);
}
// 将若干文件 [{name, bytes}] 打包成 store 模式 zip 的 Blob
function makeZip(files) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  for (const f of files) {
    const data = f.bytes;
    const nameBytes = enc.encode(f.name);
    const crc = crc32(data);
    const local = new Uint8Array(30 + nameBytes.length + data.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, 0, true); // store
    dv.setUint32(14, crc, true); dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameBytes.length, true); dv.setUint16(28, 0, true);
    local.set(nameBytes, 30); local.set(data, 30 + nameBytes.length);
    chunks.push(local);
    const cd = new Uint8Array(46 + nameBytes.length);
    const cdv = new DataView(cd.buffer);
    cdv.setUint32(0, 0x02014b50, true); cdv.setUint16(4, 20, true); cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0, true); cdv.setUint16(10, 0, true); cdv.setUint16(12, 0, true);
    cdv.setUint32(16, crc, true); cdv.setUint32(20, data.length, true); cdv.setUint32(24, data.length, true);
    cdv.setUint16(28, nameBytes.length, true); cdv.setUint16(30, 0, true); cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true); cdv.setUint16(36, 0, true); cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    cd.set(nameBytes, 46);
    central.push(cd);
    offset += local.length;
  }
  let centralSize = 0; central.forEach(c => centralSize += c.length);
  const centralOffset = offset;
  const end = new Uint8Array(22);
  const edv = new DataView(end.buffer);
  edv.setUint32(0, 0x06054b50, true); edv.setUint16(8, files.length, true);
  edv.setUint16(10, files.length, true); edv.setUint32(12, centralSize, true);
  edv.setUint32(16, centralOffset, true); edv.setUint16(20, 0, true);
  const blob = new Blob([...chunks, ...central, end], { type: 'application/zip' });
  return blob;
}
// 解析 store 模式 zip，返回 Map<name, Uint8Array>
function parseZip(bytes) {
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const files = new Map();
  // 从末尾 EOCD 找 central directory 偏移
  let eocd = -1;
  for (let i = bytes.length - 22; i >= 0; i--) { if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
  if (eocd < 0) throw new Error('不是有效的 ZIP 文件');
  const cdOffset = dv.getUint32(eocd + 16, true);
  let p = cdOffset;
  const count = dv.getUint16(eocd + 10, true);
  for (let i = 0; i < count; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const crc = dv.getUint32(p + 16, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOffset = dv.getUint32(p + 42, true);
    const nameBytes = bytes.subarray(p + 46, p + 46 + nameLen);
    const name = new TextDecoder().decode(nameBytes);
    const ldv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const dataOff = localOffset + 30 + ldv.getUint16(localOffset + 26, true) + ldv.getUint16(localOffset + 28, true);
    const data = bytes.subarray(dataOff, dataOff + compSize);
    if (method === 0 && crc32(data) !== crc) console.warn('ZIP 条目 CRC 校验失败:', name);
    files.set(name, data);
    p += 46 + nameLen + extraLen + commentLen;
  }
  return files;
}

// —— 配置序列化 ——
function texturePayload(slot) {
  const tex = slot === 1 ? tex1 : tex2;
  if (!tex || !tex.image || !tex.image.src || tex.image.src.indexOf('data:') !== 0) return null;
  const src = tex.image.src;
  const m = src.match(/^data:(image\/[a-z]+);base64,(.*)$/);
  if (!m) return null;
  return { name: slot === 1 ? 'tex1' : 'tex2', mime: m[1], base64: m[2] };
}
function serializeConfig(withTextures) {
  const cfg = { type: '3dm-config', version: 1, params: P };
  if (withTextures) {
    const t = [];
    const t1 = texturePayload(1), t2 = texturePayload(2);
    if (t1) t.push(t1); if (t2) t.push(t2);
    if (t.length) cfg.textures = t;
  }
  return cfg;
}
function downloadBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// 由配置名称生成安全文件名：去除路径分隔符等非法字符，空格转下划线；留空回退默认名
function safeFileName(name, fallback) {
  const s = (name || '').trim();
  if (!s) return fallback;
  const cleaned = s.replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '_').replace(/^\.+|\.+$/g, '').slice(0, 80);
  return cleaned || fallback;
}
function exportConfigJSON() {
  const blob = new Blob([JSON.stringify(serializeConfig(false), null, 2)], { type: 'application/json' });
  downloadBlob(blob, safeFileName(P.cfgName, 'mousepad-config') + '.json');
}
function exportConfigZip() {
  const cfg = serializeConfig(true);
  const enc = new TextEncoder();
  const files = [{ name: 'config.json', bytes: enc.encode(JSON.stringify(cfg, null, 2)) }];
  (cfg.textures || []).forEach(t => {
    const bin = Uint8Array.from(atob(t.base64), c => c.charCodeAt(0));
    const ext = t.mime.split('/')[1] || 'png';
    files.push({ name: `${t.name}.${ext}`, bytes: bin });
  });
  const blob = makeZip(files);
  downloadBlob(blob, safeFileName(P.cfgName, 'mousepad-config') + '.zip');
}
async function importConfigFile(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  let cfg;
  if (file.name.toLowerCase().endsWith('.zip')) {
    const files = parseZip(buf);
    const json = files.get('config.json');
    if (!json) throw new Error('ZIP 中缺少 config.json');
    cfg = JSON.parse(new TextDecoder().decode(json));
    for (const [name, data] of files) {
      if (name === 'config.json') continue;
      const slot = name.startsWith('tex1') ? 1 : name.startsWith('tex2') ? 2 : 0;
      if (!slot) continue;
      const mime = name.endsWith('.png') ? 'image/png' : name.endsWith('.jpg') || name.endsWith('.jpeg') ? 'image/jpeg' : 'image/png';
      const dataURL = `data:${mime};base64,` + b64FromBytes(data);
      if (slot === 1) {
        makeTex(dataURL, t => { setTex(1, t); refreshTextures(); rebuild(); setDZPreview(document.getElementById('dz1'), dataURL, () => resetDZ('dz1', '点击上传主贴图<br><small>或拖拽图片到画布</small>', () => { clearTex(1); rebuild(); })); });
      } else {
        makeTex(dataURL, t => { setTex(2, t); refreshTextures(); rebuild(); setDZPreview(document.getElementById('dz2'), dataURL, () => resetDZ('dz2', '点击上传腕托贴图（可选）<br><small>上传后将覆盖腕托区域</small>', () => { clearTex(2); refreshTextures(); rebuild(); })); });
      }
    }
  } else {
    cfg = JSON.parse(new TextDecoder().decode(buf));
  }
  if (!cfg || cfg.type !== '3dm-config' || !cfg.params) throw new Error('文件格式不正确');
  Object.assign(P, cfg.params);
  // 兼容旧版配置：经典轮廓锚点曾以 {p:{x,y}, h1, h2} 嵌套结构存储，
  // 运行时约定为顶层 {x,y,h1,h2}，导入时统一提升，避免被判为无效而退回程序化默认。
  let cc = cfg.params.classicCtrl;
  if (Array.isArray(cc) && cc.length && cc[0] && cc[0].p && !('x' in cc[0])) {
    cc = cc.map(pt => ({
      x: pt.p.x, y: pt.p.y,
      h1: pt.h1 ? { x: pt.h1.x, y: pt.h1.y } : undefined,
      h2: pt.h2 ? { x: pt.h2.x, y: pt.h2.y } : undefined,
    }));
  }
  P.classicCtrl = cc || null;
  rebuild();
  refreshShapeUI();
  if (window.refreshWristUI) window.refreshWristUI();
  uiSyncers.forEach(f => f());
  syncTexUI('t1'); syncTexUI('t2');
  toast('配置已导入', 'ok');
}

/* ================= 主循环 ================= */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (curveEdit) { setEditOrtho(); resizeCurveLayer(); drawCurveOverlay(); }
}
window.addEventListener('resize', resize);

rebuild();
updateLights();
updateBackground();
resize();
// 默认：经典模式，编辑轮廓默认不勾选（用户按需开启）

(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  // 编辑态：用正交相机渲染（与覆盖层投影严格同源）
  const renderCam = curveEdit && orthoCam ? orthoCam : camera;
  renderer.render(scene, renderCam);
  // 叠加层按需重绘：每帧最多一次。
  //   overlayDirty  —— 常规路径，由 rebuild / setEditOrtho / resizeCurveLayer 显式置脏；
  //   overlayKey()  —— 兜底，直接比对绘制输入（含几何），任何漏置脏的变化也能捕获。
  // 旧实现是两段各自比较、且共用同一把 lastCamKey 而格式不同，导致每帧必重绘 2 次。
  if (curveEdit && (overlayDirty || overlayKey() !== lastOverlayKey)) drawCurveOverlay();
})();
</script>
<div id="toast-wrap"></div>
